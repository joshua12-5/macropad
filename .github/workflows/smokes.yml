# Host-only checks — no Pico SDK / firmware build required:
#   ruff (lint + format check) → run_all_smokes.py (18 smokes, incl. the firmware OLED menu built with the host cc) → --self-test (Qt offscreen)
#   → full HIL suite against the mock device (JSON report kept as an artifact).
name: Host smokes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smokes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: configurator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Qt runtime libraries (offscreen needs libEGL / fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install configurator dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint + format check, config in ruff.toml)
        working-directory: .
        run: |
          pip install "ruff==0.16.9"
          ruff check --output-format=github .
          ruff format --check .

      - name: Run all host smokes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_all_smokes.py

      - name: Self-test (python -m macropad_config --self-test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m macropad_config --self-test

      - name: HIL suite (mock device, flash writes enabled)
        run: python scripts/hil_test.py --mock --allow-flash-write --no-color --json hil-mock-report.json

      - name: Upload HIL mock report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil-mock-report
          path: configurator/hil-mock-report.json
          if-no-files-found: warn
