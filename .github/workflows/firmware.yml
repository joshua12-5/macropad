# Firmware build: RP2040-Zero UF2 via Pico SDK + TinyUSB (target `macropad` → macropad.uf2).
# Pinned SDK tag / board must match firmware/README.md and docs/VERSIONING.md.
# Also a reusable workflow (workflow_call) — release.yml calls it and renames the
# uploaded .uf2/.elf to macropad-fw-<version>.*.
name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  PICO_SDK_TAG: "2.1.1"
  PICO_BOARD: waveshare_rp2040_zero
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: macropad

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build build-essential python3
          arm-none-eabi-gcc --version | head -1

      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}-submodules-v1

      - name: Checkout Pico SDK ${{ env.PICO_SDK_TAG }} (+ submodules)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_TAG" \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1

      - name: Configure
        working-directory: macropad/firmware
        run: cmake -B build -G Ninja -DPICO_BOARD="$PICO_BOARD"

      - name: Build
        working-directory: macropad/firmware
        run: ninja -C build

      - name: Size + flash-map check
        working-directory: macropad/firmware
        run: |
          set -euo pipefail
          elf=build/macropad.elf
          uf2=build/macropad.uf2
          arm-none-eabi-size "$elf"
          ls -l "$uf2"
          end=$(arm-none-eabi-nm "$elf" | awk '$3=="__flash_binary_end"{print $1}')
          # Flash map (2 MiB): image from 0x000000, idle-animation region
          # 0x1DF000-0x1FEFFF (128 KiB), MPFL storage sector 0x1FF000.
          anim=$((0x10000000 + 0x1DF000))
          storage=$((0x10000000 + 0x1FF000))
          echo "flash_binary_end=0x$end anim=0x$(printf '%X' $anim) storage=0x$(printf '%X' $storage)"
          echo "headroom below anim region: $(( (anim - 16#$end) / 1024 )) KiB"
          if [ $((16#$end)) -gt $anim ]; then
            echo "::error::firmware image overlaps the animation region / storage sector"; exit 1
          fi

      - name: Upload UF2 + ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: macropad-firmware-uf2
          path: |
            macropad/firmware/build/macropad.uf2
            macropad/firmware/build/macropad.elf
          if-no-files-found: error
